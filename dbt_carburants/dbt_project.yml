name: carburants
version: "1.0.0"
profile: carburants

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Un prix non mis à jour depuis plus de N jours est considéré comme périmé
  jours_peremption: 7
  prix_min: 0.5
  prix_max: 4

models:
  carburants:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
